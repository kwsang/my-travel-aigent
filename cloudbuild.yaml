steps:
  # 1. Build and push Backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/api:$BUILD_ID', '-f', 'gemini_agent/Dockerfile', '.']
    env: ['DOCKER_BUILDKIT=1']
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/api:$BUILD_ID']

  # 2. Initial API Deployment (Sets up the service to get a URL)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api-initial'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Discover existing web URL or use a local placeholder for the first run
        WEB_URL=$(gcloud run services describe travel-aigent-web --region us-central1 --format='value(status.url)' 2>/dev/null || echo "http://localhost:3000")
        
        # Replace placeholders. Using $PROJECT_ID (GCB) and $$WEB_URL (Shell).
        sed -i "s|PROJECT_ID_PLACEHOLDER|$PROJECT_ID|g" cloudrun-api.yml
        sed -i "s|FRONTEND_URL_PLACEHOLDER|$$WEB_URL|g" cloudrun-api.yml
        sed -i "s|BUILD_ID_PLACEHOLDER|$BUILD_ID|g" cloudrun-api.yml
        sed -i "s|IMAGE_TAG_PLACEHOLDER|$BUILD_ID|g" cloudrun-api.yml
        
        echo "🚀 Deploying API service..."
        gcloud run services replace cloudrun-api.yml --region=us-central1
        
        # Ensure public access (Allow Unauthenticated)
        gcloud run services add-iam-policy-binding travel-aigent-api \
          --member="allUsers" --role="roles/run.invoker" \
          --region=us-central1 --quiet

        # Export the real API_URL to a file for the web build step
        gcloud run services describe travel-aigent-api --region us-central1 --format='value(status.url)' > api_url.txt

  # 3. Build and push Frontend image
  # Using the docker builder instead of cloud-sdk to fix "docker: command not found"
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Read the API URL from the file created in the previous step
        API_URL=$(cat api_url.txt)
        
        docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/web:$BUILD_ID \
          --build-arg NEXT_PUBLIC_API_URL=$$API_URL \
          --build-arg GOOGLE_MAPS_API_KEY=$_GOOGLE_MAPS_API_KEY ./web
    env: ['DOCKER_BUILDKIT=1']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/web:$BUILD_ID']

  # 4. Final Deployment (Linking Frontend to Backend URLs)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-and-link'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # 1. Fetch real API URL
        API_URL=$(gcloud run services describe travel-aigent-api --region us-central1 --format='value(status.url)')
        
        # 2. Discover existing web URL or use placeholder for the very first 'replace'
        WEB_URL=$(gcloud run services describe travel-aigent-web --region us-central1 --format='value(status.url)' 2>/dev/null || echo "https://pending-deployment")
        
        # Update Web YAML and Deploy
        sed -i "s|PROJECT_ID_PLACEHOLDER|$PROJECT_ID|g" cloudrun-web.yaml
        sed -i "s|API_URL_PLACEHOLDER|$$API_URL|g" cloudrun-web.yaml
        sed -i "s|WEB_URL_PLACEHOLDER|$$WEB_URL|g" cloudrun-web.yaml
        sed -i "s|BUILD_ID_PLACEHOLDER|$BUILD_ID|g" cloudrun-web.yaml
        sed -i "s|IMAGE_TAG_PLACEHOLDER|$BUILD_ID|g" cloudrun-web.yaml
        
        echo "🚀 Deploying Web service..."
        gcloud run services replace cloudrun-web.yaml --region=us-central1
        
        # Ensure public access (Allow Unauthenticated)
        gcloud run services add-iam-policy-binding travel-aigent-web \
          --member="allUsers" --role="roles/run.invoker" \
          --region=us-central1 --quiet

        # 3. Link Backend CORS to the now-guaranteed real Web URL
        FINAL_WEB_URL=$(gcloud run services describe travel-aigent-web --region us-central1 --format='value(status.url)')
        echo "🔗 Linking API CORS to: $$FINAL_WEB_URL"
        sed -i "/name: FRONTEND_URL/{n;s|value:.*|value: \"$$FINAL_WEB_URL\"|}" cloudrun-api.yml
        gcloud run services replace cloudrun-api.yml --region=us-central1

  # 5. Build and push Sync Job image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-sync'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/sync:$BUILD_ID', '-f', 'Dockerfile.sync', '.']
    env: ['DOCKER_BUILDKIT=1']
  
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sync'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/sync:$BUILD_ID']

  # 6. Deploy Cloud Run Job & Scheduler
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-sync-job'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🚀 Deploying Sync Places Job..."
        
        # Create or update the Cloud Run Job
        gcloud run jobs update sync-places-job \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/sync:$BUILD_ID \
          --region us-central1 \
          --set-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=us-central1 \
          --set-secrets="VOYAGE_API_KEY=VOYAGE_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,MONGODB_URI=MONGODB_URI:latest" \
          --service-account travel-aigent-runner@$PROJECT_ID.iam.gserviceaccount.com \
          || \
        gcloud run jobs create sync-places-job \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/sync:$BUILD_ID \
          --region us-central1 \
          --set-env-vars GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=us-central1 \
          --set-secrets="VOYAGE_API_KEY=VOYAGE_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,MONGODB_URI=MONGODB_URI:latest" \
          --service-account travel-aigent-runner@$PROJECT_ID.iam.gserviceaccount.com
          
        echo "⏰ Configuring Cloud Scheduler Trigger..."
        # Create or update the Scheduler Trigger
        gcloud scheduler jobs update http sync-places-schedule \
          --location us-central1 \
          --schedule "0 2 * * *" \
          --uri "https://us-central1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/$PROJECT_ID/jobs/sync-places-job:run" \
          --http-method POST \
          --oauth-service-account-email travel-aigent-runner@$PROJECT_ID.iam.gserviceaccount.com \
          || \
        gcloud scheduler jobs create http sync-places-schedule \
          --location us-central1 \
          --schedule "0 2 * * *" \
          --uri "https://us-central1-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/$PROJECT_ID/jobs/sync-places-job:run" \
          --http-method POST \
          --oauth-service-account-email travel-aigent-runner@$PROJECT_ID.iam.gserviceaccount.com

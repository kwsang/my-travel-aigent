steps:
  # 1. Build and push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/api:latest', '-f', 'gemini_agent/Dockerfile', '.']
    env: ['DOCKER_BUILDKIT=1']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/api:latest']

  # 2. Build and push Frontend
  # Note: NEXT_PUBLIC_API_URL is passed as a build arg for Next.js bundle baking
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/web:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_API_URL'
      - './web'
    env: ['DOCKER_BUILDKIT=1']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/travel-aigent/web:latest']

  # 3. Deploy using YAML configurations (The "Source of Truth")
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Replace ${PROJECT_ID} in YAML files before deployment
        sed -i "s/\${PROJECT_ID}/$PROJECT_ID/g" cloudrun-api.yml
        sed -i "s/\${PROJECT_ID}/$PROJECT_ID/g" cloudrun-web.yaml
        
        # Deploy services
        gcloud run services replace cloudrun-api.yml --region=us-central1
        gcloud run services replace cloudrun-web.yaml --region=us-central1

substitutions:
  _API_URL: "https://travel-aigent-api-your-id-uc.a.run.app"

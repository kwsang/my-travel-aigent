steps:
  # 1. Build and push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/travel-agent-api', './gemini-agent']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/travel-agent-api']

  # 2. Build and push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/travel-agent-web', './web']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/travel-agent-web']

  # 3. Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'travel-agent-api'
      - '--image=gcr.io/$PROJECT_ID/travel-agent-api'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=FRONTEND_URL=https://travel-agent-web-url-placeholder.a.run.app'

  # 4. Deploy Frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: 
      - 'run'
      - 'deploy'
      - 'travel-agent-web'
      - '--image=gcr.io/$PROJECT_ID/travel-agent-web'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=INTERNAL_API_URL=https://travel-agent-api-url-placeholder.a.run.app'

images:
  - 'gcr.io/$PROJECT_ID/travel-agent-api'
  - 'gcr.io/$PROJECT_ID/travel-agent-web'
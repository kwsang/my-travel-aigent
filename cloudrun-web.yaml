apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: travel-aigent-web
spec:
  template:
    metadata:
      annotations:
        build-id: "BUILD_ID_PLACEHOLDER"
    spec:
      # Placeholders to be replaced by sed in cloudbuild.yaml
      serviceAccountName: travel-aigent-runner@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/travel-aigent/web:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            # Placeholders replaced dynamically during build
            - name: NEXT_PUBLIC_API_URL
              value: "API_URL_PLACEHOLDER"
            # If you implement NextAuth, map the secret here
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: NEXTAUTH_SECRET
                  key: latest
            - name: NEXTAUTH_URL
              value: "WEB_URL_PLACEHOLDER"
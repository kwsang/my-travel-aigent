[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_travel_aigent"
version = "0.1.0"
description = "Autonomous travel assistant powered by Gemini and ADK"
dependencies = [
    "fastapi",
    "uvicorn",
    "motor",
    "python-dotenv",
    "google-adk"
]

[tool.setuptools.packages.find]
include = ["gemini_agent*"]
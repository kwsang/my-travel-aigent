openapi: 3.0.0
info:
  title: Query User Profile MCP Tool
  version: 1.0.0
  description: Tool for retrieving persistent user preferences, budget constraints, and circadian profiles from MongoDB Atlas.
paths:
  /query_user_profile:
    post:
      summary: Fetch a user's travel profile and preferences.
      operationId: query_user_profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  description: The unique identifier for the user.
              required:
                - user_id
      responses:
        '200':
          description: The user's profile containing preferences and constraints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
components:
  schemas:
    UserProfile:
      type: object
      properties:
        user_id:
          type: string
        preferences:
          type: object
          properties:
            circadian_preference:
              type: string
              enum: [early_bird, night_owl, standard]
            starting_location:
              type: string
              description: The user's point of origin (city, airport code, or address).
            risk_tolerance:
              type: string
              enum: [relaxed, strict]
            target_duration_days:
              type: integer
              description: The user's desired length of the trip in days.
            group_planning_per_person:
              type: boolean
              description: Whether to display and calculate costs per person instead of a total.
            room_sharing:
              type: boolean
              description: Whether the party intends to share hotel rooms.
            people_per_room:
              type: integer
              description: Number of people intended to share a single room.
            party_size:
              type: object
              properties:
                adults: { type: integer }
                children: { type: integer }
            activity_density:
              type: string
              enum: [low, medium, high]
            min_rating:
              type: number
            budget:
              type: object
              properties:
                total_limit:
                  type: number
                currency:
                  type: string